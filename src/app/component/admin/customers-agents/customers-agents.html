<div class="card">
  <div class="card-header fw-bold">
    Customers & Agents
  </div>
  <div class="card-body">

    <!-- Search / Filter -->
    <div class="row mb-3">
      <div class="col-md-4">
        <input type="text" class="form-control" placeholder="Search by name..." [(ngModel)]="searchName">
      </div>
      <div class="col-md-4">
        <select class="form-select" [(ngModel)]="filterKyc">
          <option value="">Filter by KYC</option>
          <option value="PENDING">Pending</option>
          <option value="VERIFIED">Verified</option>
          <option value="REJECTED">Rejected</option>
        </select>
      </div>
    </div>

    <!-- Table -->
    <table class="table table-striped">
      <thead class="table-dark">
        <tr>
          <th scope="col">Customer Code</th>
          <th scope="col">Full Name</th>
          <th scope="col">Gender</th>
          <th scope="col">Phone</th>
          <th scope="col">KYC Status</th>
          <th scope="col">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let customer of filteredCustomers">
            <td>{{ customer.customerCode }}</td>
            <td>{{ customer.fullName }}</td>
            <td>{{ customer.gender }}</td>
            <td>{{ customer.phone }}</td>
            <td>
                <span class="badge" 
                    [ngClass]="{
                        'bg-warning': customer.kycStatus === 'PENDING',
                        'bg-success': customer.kycStatus === 'VERIFIED',
                        'bg-danger': customer.kycStatus === 'REJECTED'
                    }">
                {{ customer.kycStatus }}
                </span>
            </td>
            <td>
                <button class="btn btn-sm btn-primary me-2" (click)="viewCustomer(customer)">View</button>
                <button class="btn btn-sm btn-secondary me-2" (click)="editCustomer(customer)">Edit</button>
                <button class="btn btn-sm"
                        [ngClass]="customer.kycStatus === 'VERIFIED' ? 'btn-danger' : 'btn-success'"
                        (click)="toggleKycStatus(customer)">
                {{ customer.kycStatus === 'VERIFIED' ? 'Reject' : 'Activate' }}
                </button>
            </td>
            </tr>
      </tbody>
    </table>
    <div class="d-flex justify-content-between align-items-center mt-3">
      <button class="btn btn-outline-secondary" 
              (click)="prevPage()" 
              [disabled]="currentPage() === 0">
        ← Previous
      </button>
      <span>Page {{ currentPage() + 1 }}</span>
      <button class="btn btn-outline-secondary" 
              (click)="nextPage()" 
              [disabled]="!hasNextPage()">
        Next →
      </button>
    </div>
  </div>
</div>
